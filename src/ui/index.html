<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chặn click ảo</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--quiet:#5d6470;--line:#e3e6eb;--accent:#1f6feb;--accent-ink:#fff;--good:#1a7f37;--warn:#9a6700;--bad:#cf222e;--chip:#eef1f5;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--ink:#e8eaee;--quiet:#9aa2ae;--line:#2a2f37;--accent:#4c8dff;--accent-ink:#0b0d10;--good:#3fb950;--warn:#d29922;--bad:#f85149;--chip:#222730}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:16px}
main{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 10px}
p.lead{color:var(--quiet);margin:0 0 20px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{font-family:var(--mono);font-size:13px}
label{display:block;font-size:13px;color:var(--quiet);margin:12px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.site h3{margin:0;font-size:16px}
.site .dom{color:var(--quiet);font-size:13px;margin:2px 0 12px;word-break:break-all}
.stats{display:flex;gap:18px;margin:10px 0 14px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--quiet)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 10px;font-size:12px;margin-right:4px}
.mode-off{color:var(--quiet)}.mode-log{color:var(--accent)}.mode-suggest{color:var(--warn)}.mode-auto{color:var(--good)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--quiet);font-weight:500}
td.mono,.mono{font-family:var(--mono);font-size:12.5px}
.tablewrap{overflow-x:auto}
.verdict-block{color:var(--bad);font-weight:600}.verdict-watch{color:var(--warn)}.verdict-exempt{color:var(--good)}
.empty{color:var(--quiet);font-size:14px;padding:12px 0}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.ok{color:var(--good);font-size:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(620px,94vw);padding:20px 22px}
dialog::backdrop{background:#0008}
.hint{font-size:12.5px;color:var(--quiet);margin-top:4px}
a{color:var(--accent)}
.back{display:inline-block;margin-bottom:12px;cursor:pointer}
.reason{display:inline-block;background:var(--chip);border-radius:6px;padding:0 6px;margin:1px 3px 1px 0;font-size:12px}
@media (max-width:640px){.row{grid-template-columns:1fr}header{padding:12px 16px}}
</style>
</head>
<body>
<header><b>Chặn click ảo · Google Ads</b><button id="logout" hidden>Đăng xuất</button></header>
<main id="app"></main>

<dialog id="editDlg">
  <form id="editForm" method="dialog">
    <h1 id="editTitle">Website</h1>
    <div class="row">
      <div><label>Mã site (không đổi được sau khi tạo)</label><input name="id" required pattern="[a-z0-9-]{2,40}" placeholder="vd: xaydungkimanh"></div>
      <div><label>Tên hiển thị</label><input name="name" required></div>
    </div>
    <label>Domain (cách nhau bằng dấu phẩy)</label><input name="domains" required placeholder="xaydungkimanh.com">
    <div class="row">
      <div><label>ID tài khoản Google Ads</label><input name="ads_customer_id" placeholder="123-456-7890"></div>
      <div><label>Chế độ</label>
        <select name="mode">
          <option value="off">Tắt</option>
          <option value="log">Chỉ ghi log</option>
          <option value="suggest">Gợi ý chặn (bạn duyệt)</option>
          <option value="auto">Tự chặn qua Google Ads API</option>
        </select></div>
    </div>
    <div class="row">
      <div><label>Bắt đầu từ ngày</label><input name="start" type="date"></div>
      <div><label>Đến ngày</label><input name="end" type="date"></div>
    </div>
    <div class="row">
      <div><label>Chỉ chạy từ giờ (0–23)</label><input name="hour_from" type="number" min="0" max="23" placeholder="để trống = cả ngày"></div>
      <div><label>Đến giờ</label><input name="hour_to" type="number" min="0" max="24"></div>
    </div>
    <label><input name="follow_campaigns" type="checkbox" style="width:auto"> Tự "ngủ" khi mọi chiến dịch Search tạm dừng (cần kết nối Google Ads API)</label>
    <div class="row">
      <div><label>Ngưỡng theo dõi</label><input name="watch_threshold" type="number" min="1" max="100"></div>
      <div><label>Ngưỡng chặn</label><input name="block_threshold" type="number" min="1" max="100"></div>
    </div>
    <div class="row">
      <div><label>Nhóm chia sẻ danh sách chặn</label><input name="share_group" placeholder="vd: kim-anh"><div class="hint">Các site cùng nhóm dùng chung IP bị chặn. Chỉ đặt cho các domain cùng một công ty.</div></div>
      <div><label>Telegram chat ID</label><input name="telegram_chat_id" placeholder="không bắt buộc"></div>
    </div>
    <div id="editErr" class="err"></div>
    <div class="actions" style="margin-top:18px;justify-content:flex-end">
      <button type="button" id="editCancel">Hủy</button>
      <button type="submit" class="primary">Lưu</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const app = document.getElementById('app');
  const KEY = 'gcf_admin_token';
  let token = sessionStorage.getItem(KEY) || '';
  let sites = [];

  const MODE = { off: 'Tắt', log: 'Chỉ ghi log', suggest: 'Gợi ý chặn', auto: 'Tự chặn' };
  const VERDICT = { normal: 'Bình thường', watch: 'Theo dõi', block: 'Gắn cờ', exempt: 'Khách thật', pending: 'Chờ chấm' };
  const REASON = {
    NET_DATACENTER: 'IP máy chủ', NET_VPN: 'VPN/proxy', NET_RELAY: 'iCloud Relay', OUT_OF_AREA: 'Ngoài vùng',
    AUTOMATION: 'Trình duyệt tự động', DEVICE_MULTI_IP: 'Nhiều IP/thiết bị', BOUNCE: 'Thoát < 3 giây',
    NO_END_SIGNAL: 'Không có tín hiệu kết thúc', REPEAT_CLICKS: 'Click lặp lại', LEAD_FAKE: 'Lead giả/đối thủ',
    EXEMPT_CONVERSION: 'Đã chuyển đổi',
  };
  const STATUS = { suggested: 'Gợi ý', active: 'Đang chặn', expired: 'Hết hạn', removed: 'Đã gỡ' };

  // Mọi dữ liệu từ server đều đi qua esc(): đường dẫn, tên nhà mạng... do người truy cập tạo ra.
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtTime = (ms) => ms ? new Date(ms).toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false }) : '';
  const rand = (n) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

  async function api(path, opts = {}) {
    const res = await fetch('/admin' + path, {
      ...opts,
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
    });
    if (res.status === 401) { logout(); throw new Error('Khóa quản trị không đúng.'); }
    const type = res.headers.get('Content-Type') || '';
    const body = type.includes('json') ? await res.json() : await res.text();
    if (!res.ok) throw new Error((body && body.error) || ('Lỗi ' + res.status));
    return body;
  }

  function logout() {
    token = '';
    sessionStorage.removeItem(KEY);
    document.getElementById('logout').hidden = true;
    renderLogin();
  }
  document.getElementById('logout').onclick = logout;

  function renderLogin(msg) {
    app.innerHTML = `
      <div class="card" style="max-width:420px;margin:40px auto">
        <h1>Đăng nhập</h1>
        <p class="lead">Nhập ADMIN_TOKEN đã lưu trong GitHub Secrets. Khóa chỉ giữ trong tab này, đóng tab là mất.</p>
        <form id="loginForm"><input id="tok" type="password" autocomplete="current-password" required>
        <div class="err">${esc(msg)}</div>
        <button class="primary" style="margin-top:14px;width:100%">Vào trang quản lý</button></form>
      </div>`;
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      token = document.getElementById('tok').value.trim();
      try {
        await api('/sites');
        sessionStorage.setItem(KEY, token);
        document.getElementById('logout').hidden = false;
        route();
      } catch (err) { renderLogin(err.message); }
    };
  }

  const verdictCount = (summary, v) => ((summary.visits_by_verdict || []).find((x) => x.verdict === v) || {}).n || 0;
  const total = (summary) => (summary.visits_by_verdict || []).reduce((s, x) => s + x.n, 0);

  async function renderSites() {
    app.innerHTML = '<p class="empty">Đang tải…</p>';
    sites = await api('/sites');
    const summaries = await Promise.all(sites.map((s) => api(`/sites/${encodeURIComponent(s.id)}/summary?days=7`).catch(() => ({}))));
    app.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
        <div><h1>Website</h1><p class="lead">Số liệu 7 ngày gần nhất. Mỗi website một tài khoản Google Ads và chế độ riêng.</p></div>
        <button class="primary" id="addSite">+ Thêm website</button>
      </div>
      <div class="sites">${sites.map((s, i) => {
        const sm = summaries[i] || {};
        return `<div class="card site">
          <h3>${esc(s.name)}</h3>
          <div class="dom">${esc(s.domains.join(', '))}</div>
          <span class="chip mode-${esc(s.mode)}">${esc(MODE[s.mode])}</span>
          ${s.share_group ? `<span class="chip">nhóm ${esc(s.share_group)}</span>` : ''}
          ${s.ads_customer_id ? '' : '<span class="chip">chưa có ID Google Ads</span>'}
          <div class="stats">
            <div class="stat"><b>${total(sm)}</b><span>lượt quảng cáo</span></div>
            <div class="stat"><b>${verdictCount(sm, 'block')}</b><span>gắn cờ</span></div>
            <div class="stat"><b>${verdictCount(sm, 'exempt')}</b><span>khách thật</span></div>
          </div>
          <div class="actions">
            <button data-open="${esc(s.id)}">Xem chi tiết</button>
            <button data-edit="${esc(s.id)}">Sửa</button>
          </div>
        </div>`;
      }).join('')}</div>`;
    document.getElementById('addSite').onclick = () => openEdit(null);
    app.querySelectorAll('[data-open]').forEach((b) => (b.onclick = () => { location.hash = 'site/' + b.dataset.open; }));
    app.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => openEdit(sites.find((s) => s.id === b.dataset.edit))));
  }

  // ---------- Sửa / thêm site ----------
  const dlg = document.getElementById('editDlg');
  const form = document.getElementById('editForm');
  let editing = null;
  document.getElementById('editCancel').onclick = () => dlg.close();

  function openEdit(site) {
    editing = site;
    document.getElementById('editTitle').textContent = site ? 'Sửa ' + site.name : 'Thêm website';
    document.getElementById('editErr').textContent = '';
    const f = form.elements;
    f.id.value = site ? site.id : '';
    f.id.readOnly = !!site;
    f.name.value = site ? site.name : '';
    f.domains.value = site ? site.domains.join(', ') : '';
    f.ads_customer_id.value = site && site.ads_customer_id ? site.ads_customer_id : '';
    f.mode.value = site ? site.mode : 'log';
    const sch = (site && site.schedule) || {};
    f.start.value = sch.start || '';
    f.end.value = sch.end || '';
    f.hour_from.value = sch.hours ? sch.hours[0] : '';
    f.hour_to.value = sch.hours ? sch.hours[1] : '';
    f.follow_campaigns.checked = site ? !!site.follow_campaigns : true;
    f.watch_threshold.value = site ? site.watch_threshold : 40;
    f.block_threshold.value = site ? site.block_threshold : 70;
    f.share_group.value = site && site.share_group ? site.share_group : '';
    f.telegram_chat_id.value = site && site.telegram_chat_id ? site.telegram_chat_id : '';
    dlg.showModal();
  }

  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = form.elements;
    const schedule = {};
    if (f.start.value) schedule.start = f.start.value;
    if (f.end.value) schedule.end = f.end.value;
    if (f.hour_from.value !== '' && f.hour_to.value !== '') schedule.hours = [Number(f.hour_from.value), Number(f.hour_to.value)];
    const body = {
      name: f.name.value.trim(),
      site_key: editing ? editing.site_key : f.id.value.replace(/-/g, '').slice(0, 12) + '_' + rand(9),
      domains: f.domains.value.split(',').map((d) => d.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/.*$/, '')).filter(Boolean),
      ads_customer_id: f.ads_customer_id.value.trim() || null,
      mode: f.mode.value,
      schedule: Object.keys(schedule).length ? schedule : null,
      follow_campaigns: f.follow_campaigns.checked,
      watch_threshold: Number(f.watch_threshold.value),
      block_threshold: Number(f.block_threshold.value),
      share_group: f.share_group.value.trim() || null,
      telegram_chat_id: f.telegram_chat_id.value.trim() || null,
      campaign_ids: editing ? editing.campaignIds : null,
      target_countries: editing ? editing.targetCountries : ['VN'],
      resume_warmup_hours: editing ? editing.resume_warmup_hours : 72,
    };
    try {
      await api('/sites/' + encodeURIComponent(f.id.value.trim()), { method: 'PUT', body: JSON.stringify(body) });
      dlg.close();
      route();
    } catch (err) { document.getElementById('editErr').textContent = err.message; }
  };

  // ---------- Chi tiết site ----------
  async function renderSite(id) {
    app.innerHTML = '<p class="empty">Đang tải…</p>';
    if (!sites.length) sites = await api('/sites');
    const s = sites.find((x) => x.id === id);
    if (!s) { app.innerHTML = '<p class="err">Không tìm thấy website.</p>'; return; }
    const enc = encodeURIComponent(id);
    const [sm, flagged, blocks, suggested, tests] = await Promise.all([
      api(`/sites/${enc}/summary?days=7`),
      api(`/sites/${enc}/visits?verdict=block&limit=100`),
      api(`/sites/${enc}/blocks`),
      api(`/sites/${enc}/blocks/export?status=suggested`),
      api(`/sites/${enc}/visits?test=1&limit=50`),
    ]);
    const tag = `<script async src="${location.origin}/t.js?s=${s.site_key}"><\/script>`;
    const billed = sm.billed_clicks || {};
    const reasons = (sm.top_reasons || []).slice(0, 6);

    app.innerHTML = `
      <a class="back" href="#">← Tất cả website</a>
      <h1>${esc(s.name)}</h1>
      <p class="lead">${esc(s.domains.join(', '))} · <span class="mode-${esc(s.mode)}">${esc(MODE[s.mode])}</span>${s.share_group ? ' · nhóm ' + esc(s.share_group) : ''}</p>

      <div class="card"><div class="stats" style="flex-wrap:wrap;margin:0">
        <div class="stat"><b>${total(sm)}</b><span>lượt quảng cáo (7 ngày)</span></div>
        <div class="stat"><b>${verdictCount(sm, 'block')}</b><span>gắn cờ</span></div>
        <div class="stat"><b>${verdictCount(sm, 'watch')}</b><span>theo dõi</span></div>
        <div class="stat"><b>${verdictCount(sm, 'exempt')}</b><span>khách thật</span></div>
        <div class="stat"><b>${verdictCount(sm, 'pending')}</b><span>chờ chấm</span></div>
        <div class="stat"><b>${billed.billed ?? 0}</b><span>click Google tính tiền</span></div>
        <div class="stat"><b>${billed.without_visit ?? 0}</b><span>tính tiền nhưng không vào trang</span></div>
        <div class="stat"><b>${sm.test_visits ?? 0}</b><span>lượt thử (không tính)</span></div>
      </div>
      ${reasons.length ? `<div style="margin-top:10px">${reasons.map(([c, n]) => `<span class="reason">${esc(REASON[c] || c)}: ${n}</span>`).join('')}</div>` : ''}
      </div>

      <h2>Tag GTM</h2>
      <div class="card">
        <div class="hint" style="margin:0 0 8px">Custom HTML, trigger Window Loaded khi URL có gclid/gbraid/wbraid hoặc cookie _gcf_ad = 1. Xem docs/gtm-setup.md trong repo.</div>
        <textarea id="tag" rows="2" readonly>${esc(tag)}</textarea>
        <div class="actions" style="margin-top:8px"><button data-copy="tag">Sao chép tag</button></div>
      </div>

      <h2>IP gợi ý chặn</h2>
      <div class="card">
        ${suggested ? `<div class="hint" style="margin:0 0 8px">Dán vào Google Ads → chiến dịch → Cài đặt → Loại trừ IP. Mỗi dòng một IP.</div>
          <textarea id="ips" rows="${Math.min(10, suggested.split('\n').length + 1)}" readonly>${esc(suggested)}</textarea>
          <div class="actions" style="margin-top:8px"><button data-copy="ips">Sao chép danh sách</button></div>`
        : `<p class="empty">${s.mode === 'log' ? 'Site đang ở chế độ Chỉ ghi log nên chưa gợi ý IP nào. Chuyển sang "Gợi ý chặn" khi đã đủ dữ liệu.' : 'Chưa có IP nào cần chặn.'}</p>`}
      </div>

      <h2>Danh sách chặn</h2>
      <div class="card tablewrap">${blocks.length ? `<table>
        <tr><th>IP / dải</th><th>Trạng thái</th><th>Điểm</th><th>Mạng</th><th>Hết hạn</th><th></th></tr>
        ${blocks.map((b) => `<tr>
          <td class="mono">${esc(b.ip_key)}</td><td>${esc(STATUS[b.status] || b.status)}${b.pushed ? ' · đã đẩy' : ''}</td>
          <td>${esc(b.score)}</td><td>${esc(b.network)}</td><td>${b.expires_at ? esc(fmtTime(b.expires_at)) : 'cố định'}</td>
          <td>${b.status === 'active' || b.status === 'suggested' ? `<button class="danger" data-unblock="${esc(b.ip_key)}">Gỡ</button>` : ''}</td>
        </tr>`).join('')}</table>` : '<p class="empty">Trống.</p>'}</div>

      <h2>Lượt bị gắn cờ gần đây</h2>
      <div class="card tablewrap">${flagged.length ? `<table>
        <tr><th>Thời gian</th><th>IP</th><th>Nhà mạng</th><th>Trang</th><th>Ở lại</th><th>Lý do</th></tr>
        ${flagged.map((v) => `<tr>
          <td>${esc(fmtTime(v.started_at))}</td><td class="mono">${esc(v.ip)}</td>
          <td>${esc(v.as_org || '')} ${v.country ? '(' + esc(v.country) + ')' : ''}</td>
          <td class="mono">${esc(v.path)}</td><td>${v.dwell_ms != null ? esc(Math.round(v.dwell_ms / 1000) + ' giây') : '—'}</td>
          <td>${JSON.parse(v.reasons || '[]').map((r) => `<span class="reason">${esc(REASON[r.code] || r.code)}</span>`).join('')}</td>
        </tr>`).join('')}</table>` : '<p class="empty">Chưa có lượt nào bị gắn cờ.</p>'}</div>

      <h2>Lượt thử nghiệm</h2>
      <div class="card tablewrap">
        <div class="hint" style="margin:0 0 8px">Lượt có gclid bắt đầu bằng TEST_ (GTM Preview, giả lập). Được chấm điểm để kiểm tra bộ phát hiện, nhưng không bao giờ bị chặn và không tính vào thống kê.</div>
        ${tests.length ? `<table>
        <tr><th>Thời gian</th><th>gclid</th><th>Kết luận</th><th>Điểm</th><th>Ở lại</th><th>Lý do</th></tr>
        ${tests.map((v) => `<tr>
          <td>${esc(fmtTime(v.started_at))}</td><td class="mono">${esc(v.gclid)}</td>
          <td class="verdict-${esc(v.verdict || 'pending')}">${esc(VERDICT[v.verdict || 'pending'])}</td><td>${esc(v.score ?? '')}</td>
          <td>${v.dwell_ms != null ? esc(Math.round(v.dwell_ms / 1000) + ' giây') : '—'}</td>
          <td>${JSON.parse(v.reasons || '[]').map((r) => `<span class="reason">${esc(REASON[r.code] || r.code)}</span>`).join('')}</td>
        </tr>`).join('')}</table>` : '<p class="empty">Chưa có lượt thử nào.</p>'}
      </div>

      <div class="actions" style="margin-top:24px"><button data-edit="${esc(s.id)}">Sửa cấu hình</button>
      <a class="btn" href="/admin/sites/${enc}/refund-report" id="refund">Tải hồ sơ hoàn tiền (CSV)</a></div>`;

    app.querySelector('.back').onclick = (e) => { e.preventDefault(); location.hash = ''; };
    app.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = async () => {
      await navigator.clipboard.writeText(document.getElementById(b.dataset.copy).value);
      b.textContent = 'Đã sao chép';
    }));
    app.querySelector('[data-edit]').onclick = () => openEdit(s);
    app.querySelectorAll('[data-unblock]').forEach((b) => (b.onclick = async () => {
      const wl = confirm('Gỡ chặn ' + b.dataset.unblock + '.\nĐưa IP này vào whitelist để không bao giờ bị chặn lại? (OK = có, Cancel = chỉ gỡ)');
      await api(`/sites/${enc}/blocks/remove`, { method: 'POST', body: JSON.stringify({ ip_key: b.dataset.unblock, whitelist: wl }) });
      renderSite(id);
    }));
    document.getElementById('refund').onclick = async (e) => {
      e.preventDefault();
      const csv = await api(`/sites/${enc}/refund-report`);
      const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: `hoan-tien-${id}.csv` });
      a.click();
      URL.revokeObjectURL(url);
    };
  }

  function route() {
    if (!token) return renderLogin();
    document.getElementById('logout').hidden = false;
    const m = location.hash.match(/^#site\/(.+)$/);
    const p = m ? renderSite(decodeURIComponent(m[1])) : renderSites();
    p.catch((err) => { if (token) app.innerHTML = `<p class="err">${esc(err.message)}</p>`; });
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
