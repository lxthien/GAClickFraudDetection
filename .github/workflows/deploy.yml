name: Deploy

# Chạy tay: Actions → Deploy → Run workflow. Sau lần đầu, mỗi lần đẩy code lên main sẽ tự deploy nếu kiểm thử đạt.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '16f261d3e331778f14e7bb40605c696d' }}
    steps:
      - name: Kiểm tra secrets
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Chưa có secret CLOUDFLARE_API_TOKEN — bỏ qua deploy."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.skip != '1'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.guard.outputs.skip != '1'
        run: npm ci

      - name: Kiểm thử trước khi deploy
        if: steps.guard.outputs.skip != '1'
        run: npm test

      - name: Tìm hoặc tạo database D1 "gcf"
        if: steps.guard.outputs.skip != '1'
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="gcf");process.stdout.write(x?x.uuid:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create gcf
            ID=$(find_id)
          fi
          [ -n "$ID" ] || { echo "Không tạo được database D1"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$ID/" wrangler.toml
          echo "D1 database: $ID"

      - name: Áp dụng migration
        if: steps.guard.outputs.skip != '1'
        run: npx wrangler d1 migrations apply gcf --remote

      - name: Deploy Worker
        if: steps.guard.outputs.skip != '1'
        run: npm run deploy

      - name: Đặt ADMIN_TOKEN
        if: steps.guard.outputs.skip != '1'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -n "$ADMIN_TOKEN" ]; then
            printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          else
            echo "::warning::Chưa có secret ADMIN_TOKEN — API quản trị sẽ trả 503 cho tới khi đặt."
          fi
