name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck   # gồm build script theo dõi + kiểm tra ngân sách 3 KB
      - run: npx vitest run
      - run: npx wrangler deploy --dry-run --outdir dist
